{
  "name": "WMO Appointment Offline CI",
  "on": {
    "pull_request": {
      "branches": ["main"],
      "types": ["opened", "synchronize", "reopened", "ready_for_review"]
    }
  },
  "permissions": { "contents": "read" },
  "jobs": {
    "appointment-offline": {
      "name": "Appointment offline regression gate",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out tested revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Set up Node.js 22",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": { "node-version": "22.23.5", "package-manager-cache": false }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Run strict appointment offline gate and its negative controls",
          "run": "node scripts/ci/wmoAppointmentOfflineGate.js"
        }
      ]
    }
  }
}
