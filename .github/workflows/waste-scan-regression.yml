name: Waste Scan Offline Regression Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression gate (known historical failures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check regression-gate safeguards
        run: node --test tests/ci/wasteScanRegressionGate.test.js
      - name: Run curated offline regression gate
        run: node scripts/ci/wasteScanRegressionGate.js
